aid: workforce-software
name: WorkForce Software
description: WorkForce Software, an ADP company since October 2024, makes the WorkForce
  Suite, an enterprise workforce management platform covering time and attendance,
  employee scheduling, absence and leave management, labor forecasting, data capture,
  and payroll compliance for large, complex organizations. The Suite integrates with
  leading HCM and ERP systems (SAP, Oracle, Workday, ADP) via RESTful APIs, SOAP APIs,
  and file-based interfaces, with SSO/SLO and MFA support; API and integration
  documentation is provided to customers through the WorkForce Software community
  portal rather than a public developer portal.
